name: Feature request
description: Something the framework should do and does not
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This framework is opinionated on purpose: every feature is a thing
        every user has to read past. The strongest case for one is a concrete
        failure it prevents, not a capability it adds.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong today, and how you work around it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you considered instead
      description: Including doing it in your own code rather than in the framework.
