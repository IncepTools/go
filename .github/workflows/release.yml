name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Never publish a tag that does not pass its own tests. A release is
      # the one build people cannot re-run.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Build the CLI for every supported platform
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/icpt_${version}_${os}_${arch}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "${out}${ext}" ./cmd/icpt
            (cd dist && sha256sum "$(basename "${out}${ext}")" >> checksums.txt)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
