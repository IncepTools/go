name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to republish after a partial release"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for keyless signing: the runner's OIDC token is the identity
      # cosign binds the signature to.
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # goreleaser builds the changelog from history, so a shallow
          # clone would produce release notes covering one commit.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # Manual reruns use the current release workflow and configuration while
      # checking out the immutable tag's source and version.
      - name: Use current release configuration
        if: inputs.tag != ''
        run: git show origin/main:.goreleaser.yaml > .goreleaser.yaml

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          cache: true

      # Never publish a tag that does not pass its own tests. A release is
      # the one build nobody can re-run.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Build the examples
        working-directory: examples
        run: go build ./... && go vet ./...

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          # The tap is optional. Without its token, publishing the GitHub
          # release must still succeed instead of failing after all artifacts
          # have already been uploaded.
          args: release --clean ${{ inputs.tag != '' && '--allow-dirty' || '' }} ${{ secrets.HOMEBREW_TAP_TOKEN == '' && '--skip=brews' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # pkg.go.dev only indexes a version once somebody asks for it. Asking
  # here means the documentation for a new tag is live within a minute of
  # the release rather than whenever the first user happens to look.
  proxy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
      - name: Warm the module proxy
        run: |
          GOPROXY=proxy.golang.org \
            go list -m github.com/IncepTools/go@${GITHUB_REF_NAME} || true
