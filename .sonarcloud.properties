# SonarQube Cloud AUTOMATIC ANALYSIS configuration.
#
# This is the file automatic analysis reads. It is NOT sonar-project.properties
# — that one is only read by a scanner running in CI, which this repository
# does not have. Settings put in the wrong file are silently ignored, which is
# exactly how the duplication exclusion failed to apply the first time.
#
# Only these keys are supported here: sonar.sources, sonar.exclusions,
# sonar.inclusions, sonar.tests, sonar.test.exclusions, sonar.test.inclusions,
# sonar.sourceEncoding and sonar.cpd.exclusions. Anything else belongs in
# sonar-project.properties, and will do nothing until a scanner job exists.
#
# The file must be on the DEFAULT BRANCH to take effect, and it wins over the
# same setting configured in the SonarQube Cloud UI.

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------- what is code
#
# Go keeps tests beside the code they test, and this repository also mirrors
# them under tests/. Unless both are declared, Sonar analyses test code as
# production code: every table-driven test reads as duplication and every
# fixture as dead code.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/vendor/**/*,bin/**/*,dist/**/*,docs/**/*

# ----------------------------------------------------------------- duplication
#
# The trailing /* matters. `**` matches zero or more DIRECTORIES, so a pattern
# ending there matches the directories and not the files inside them — the
# usual reason an exclusion appears to be ignored.
#
# examples/ — ten runnable services deliberately share one shape: the same
# main.go skeleton, the same domain and module files, the same layering. That
# repetition is the lesson. A reader opens exactly one example and must find a
# complete, self-contained service in it; `worker` cannot send them to
# `scheduling` to learn how a scheduler is started, and the first thing anyone
# does with a main.go is paste it into their own project — where a shared
# examples/internal/boot package would not exist.
#
# internal/scaffold/templates.go — the generator's output, held in string
# literals. It is MEANT to look like the examples: it is what produces them.
# One generator, not copied logic.
#
# Duplication in the library itself is still reported, and still worth fixing.
sonar.cpd.exclusions=examples/**/*,internal/scaffold/templates.go
