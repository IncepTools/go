# SonarQube Cloud configuration — https://sonarcloud.io/project/overview?id=IncepTools_go
#
# Automatic analysis reads this file from the repository root. Every setting
# below says WHY it is set; a quality gate nobody can explain is one that gets
# switched off the first time it is inconvenient.

sonar.projectKey=IncepTools_go
# sonar.organization is intentionally absent. Automatic analysis takes it from
# the GitHub App binding, and a value that disagrees with the binding fails the
# analysis outright. Set it only alongside a CI scanner step (see the bottom).

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------- what is code
#
# Go keeps tests beside the code they test, and this repository also mirrors
# them under tests/. Both have to be declared as tests, or Sonar analyses test
# code as production code: every table-driven test becomes "duplicated", every
# fixture becomes dead code, and the real signal drowns.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=\
  **/*_test.go,\
  **/vendor/**,\
  bin/**,\
  dist/**,\
  docs/**

# ------------------------------------------------------------------- coverage
#
# Produced by `make cover` / the CI coverage job:
#
#   go test -coverpkg=./src/...,./internal/...,. \
#           -coverprofile=coverage.out -covermode=atomic ./...
#
# -coverpkg is not optional here: the tests live in tests/ and the code in
# src/, so without it every package reports zero and the gate is meaningless.
#
# NOTE: automatic analysis cannot run tests, so this path is only read when a
# CI scanner step uploads the profile. See the bottom of this file.
sonar.go.coverage.reportPaths=coverage.out

# Code that coverage says nothing useful about:
#
#   examples/      ten runnable services. They are exercised by CI's smoke
#                  test, which starts each one and waits for a healthy probe —
#                  a far better check than a unit test asserting that an
#                  example example-s. They are also a separate Go module, so
#                  they are not in the coverage profile at all and would read
#                  as 0%, dragging the gate down for no signal.
#   cmd/           argument parsing and process exit. The CLI's behaviour is
#                  covered through internal/, and the generated-code job
#                  builds and vets its real output.
#   templates.go   Go source held in string literals. "Coverage" of a string
#                  is a number with no meaning attached.
sonar.coverage.exclusions=\
  examples/**,\
  cmd/**,\
  internal/scaffold/templates.go

# ----------------------------------------------------------------- duplication
#
# The examples are excluded on purpose.
#
# Ten runnable services deliberately share one shape — the same main.go, the
# same domain and module files, the same layering — because that repetition IS
# the lesson. A reader opens exactly one of them and must find a complete,
# self-contained service; `worker` cannot send them to `scheduling` to learn
# how a scheduler is started.
#
# Deduplicating them would mean a shared examples/internal/boot package, which
# makes every main.go uncopyable: the first thing a reader does is paste it
# into their own project, where that import does not exist. The duplication is
# the deliberate cost of that property, so it is excluded from the detector
# rather than waived by hand every release.
#
# templates.go is excluded for the same kind of reason: it holds the scaffold's
# output as string literals, and that output is *meant* to look like the
# examples. It is one generator, not copied logic.
#
# Duplication in the library itself is still reported, and still worth fixing.
sonar.cpd.exclusions=\
  examples/**,\
  internal/scaffold/templates.go

# ---------------------------------------------------------------- rule tuning
#
# Narrow, justified, and scoped to tests only. Nothing here is switched off for
# the library.
sonar.issue.ignore.multicriteria=t1,t2

# S1192 "define a constant instead of duplicating this literal". In a
# table-driven test the repeated literal IS the test data, and hoisting it to a
# constant makes each case harder to read, not easier.
sonar.issue.ignore.multicriteria.t1.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.t1.resourceKey=**/*_test.go

# S1313 hardcoded IP addresses. The telemetry tests point exporters at
# 127.0.0.1:1 precisely BECAUSE it is unreachable, so a test can never export
# off the machine running it.
sonar.issue.ignore.multicriteria.t2.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*_test.go

# ------------------------------------------------------- about coverage import
#
# Automatic analysis does not execute anything, so it cannot produce coverage:
# sonar.go.coverage.reportPaths above is read only by a scanner running in CI.
# Importing coverage therefore needs two changes, in this order:
#
#   1. Turn OFF automatic analysis in the SonarQube Cloud project settings.
#      Leaving both on means two analyses racing for the same branch.
#   2. Add a CI job that runs the coverage profile and then
#      SonarSource/sonarqube-scan-action with a SONAR_TOKEN secret, and set
#      sonar.organization above.
#
# Doing only step 2 is worse than doing neither.
